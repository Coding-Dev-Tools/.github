name: 🐛 Bug Report
description: Report a bug to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: repo
    attributes:
      label: Which repo?
      description: Which DevForge tool does this affect?
      options:
        - api-contract-guardian
        - apighost
        - click-to-mcp
        - configdrift
        - datamorph
        - deadcode
        - deploydiff
        - devforge
        - envault
        - json2sql
        - schemaforge
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: other-repo
    attributes:
      label: Other repo name
      description: Required if you selected "Other" above
      placeholder: e.g., my-custom-tool
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Tool version
      description: What version of the tool are you using? (run `<tool-name> --version`)
      placeholder: e.g., 0.5.2
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Examples:
          - **OS**: Windows 11 / macOS 14 / Ubuntu 24.04
          - **Python version**: 3.12
      value: |
        - OS:
        - Python version:
    validations:
      required: false
