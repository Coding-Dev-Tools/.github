# DevForge — Reusable Automated Code Review Workflow
#
# Runs automated code-quality and security checks on every PR and posts
# a summary comment.  Call from any Coding-Dev-Tools repo:
#
# name: Auto Code Review
# on:
#   pull_request:
#     branches: [main]
#     types: [opened, synchronize, reopened]
# jobs:
#   code-review:
#     uses: Coding-Dev-Tools/.github/.github/workflows/auto-code-review.yml@main
#     permissions:
#       contents: read
#       pull-requests: write
#       security-events: write
#
# Supported inputs:
#   python-version    – Python version for lint tools (default: '3.12')
#   ruff-targets      – Paths ruff should scan (default: '.')
#   detect-secrets    – Run detect-secrets credential scan (default: true)
#   check-todos       – Warn on leftover TODO/FIXME/HACK (default: false)
#   max-file-size     – Fail if any file exceeds N KB (default: 500)
#   post-comment      – Post summary PR comment (default: true)

name: Auto Code Review (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for lint tools
        type: string
        required: false
        default: '3.12'
      ruff-targets:
        description: Paths ruff should scan (space-separated)
        type: string
        required: false
        default: '.'
      detect-secrets:
        description: Run detect-secrets credential scan
        type: boolean
        required: false
        default: true
      check-todos:
        description: Warn on leftover TODO/FIXME/HACK markers
        type: boolean
        required: false
        default: false
      max-file-size:
        description: Max allowed file size in KB (0 = skip)
        type: number
        required: false
        default: 500
      post-comment:
        description: Post review summary as a PR comment
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  review:
    name: Automated code review
    runs-on: ubuntu-latest
    env:
      RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
      REVIEW_DIR: ${{ runner.temp }}/code-review

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout PR head
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ inputs.python-version }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # ── Ruff lint + format check ──────────────────────────────
      - name: Install ruff
        id: install-ruff
        run: python -m pip install ruff

      - name: Ruff lint
        id: ruff-lint
        continue-on-error: true
        shell: python
        env:
          RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          import json
          import os
          import shlex
          import subprocess
          from pathlib import Path

          status, count = 'error', None
          try:
              result = subprocess.run(
                  ['ruff', 'check', *shlex.split(os.environ['RUFF_TARGETS']),
                   '--exit-zero', '--output-format=json', '--cache-dir', os.environ['RUFF_CACHE_DIR']],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True,
              )
              findings = json.loads(result.stdout)
              if not isinstance(findings, list) or any(not isinstance(item, dict) for item in findings):
                  raise ValueError('Invalid lint output')
              count = len(findings)
              status = 'complete'
          except Exception:
              print('Ruff lint could not complete; review fails closed.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              if count is not None:
                  output.write(f'count={count}\nhas_issues={str(count > 0).lower()}\n')
          raise SystemExit(0 if status == 'complete' else 1)

      - name: Ruff format check
        id: ruff-format
        continue-on-error: true
        shell: python
        env:
          RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          import os
          import shlex
          import subprocess
          from pathlib import Path

          status, has_issues = 'error', None
          try:
              result = subprocess.run(
                  ['ruff', 'format', '--check', *shlex.split(os.environ['RUFF_TARGETS']),
                   '--cache-dir', os.environ['RUFF_CACHE_DIR']],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              if result.returncode not in (0, 1):
                  raise ValueError('Format check failed')
              status, has_issues = 'complete', result.returncode == 1
          except Exception:
              print('Ruff format could not complete; review fails closed.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              if has_issues is not None:
                  output.write(f'has_issues={str(has_issues).lower()}\n')
          raise SystemExit(0 if status == 'complete' else 1)

      - name: Install detect-secrets
        id: install-secrets
        if: inputs.detect-secrets
        run: python -m pip install detect-secrets==1.5.0

      - name: Scan for secrets
        id: secrets
        if: inputs.detect-secrets
        continue-on-error: true
        shell: python
        run: |
          import contextlib
          import importlib.metadata
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from datetime import datetime
          from pathlib import Path, PurePosixPath

          # All code is inline: checkout contains the caller, not this shared repo.
          # Only generated dependency/cache directories are excluded, including nested ones.
          exclusions = r'(^|/)(\.git|node_modules|\.venv|__pycache__|\.pytest_cache)/'
          status, count = 'error', None

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate JSON key')
                  result[key] = value
              return result

          def invalid_constant(value):
              raise ValueError('Invalid JSON constant')

          try:
              # Never expose exception messages, scanner stderr, hashes, or values.
              with open(os.devnull, 'w') as quiet, contextlib.redirect_stderr(quiet):
                  from detect_secrets.settings import default_settings, get_plugins

                  if importlib.metadata.version('detect-secrets') != '1.5.0':
                      raise ValueError('Unsupported scanner version')
                  with default_settings() as settings:
                      expected = settings.json()
                      secret_types = {plugin.secret_type for plugin in get_plugins()}
                  # The pinned CLI adds its default verification policy and exclusion filter.
                  expected['filters_used'].extend([
                      {'path': 'detect_secrets.filters.common.is_ignored_due_to_verification_policies', 'min_level': 2},
                      {'path': 'detect_secrets.filters.regex.should_exclude_file', 'pattern': [exclusions]},
                  ])
                  expected['filters_used'].sort(key=lambda item: item['path'].lower())
                  with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as scratch:
                      baseline = Path(scratch) / 'scan.json'
                      with baseline.open('wb') as output:
                          result = subprocess.run(
                              [sys.executable, '-I', '-m', 'detect_secrets', 'scan', '--all-files', '--exclude-files', exclusions],
                              stdout=output, stderr=subprocess.DEVNULL,
                          )
                      if result.returncode != 0:
                          raise ValueError('Scanner did not complete')
                      data = json.loads(
                          baseline.read_text(encoding='utf-8'),
                          object_pairs_hook=unique_object, parse_constant=invalid_constant,
                      )
                  required = {'version', 'plugins_used', 'filters_used', 'results', 'generated_at'}
                  if not isinstance(data, dict) or set(data) != required or data['version'] != '1.5.0':
                      raise ValueError('Invalid scan schema or version')
                  if data['plugins_used'] != expected['plugins_used'] or not data['plugins_used']:
                      raise ValueError('Invalid scanner plugins')
                  if data['filters_used'] != expected['filters_used']:
                      raise ValueError('Invalid scanner filters')
                  datetime.strptime(data['generated_at'], '%Y-%m-%dT%H:%M:%SZ')
                  if not isinstance(data['results'], dict):
                      raise ValueError('Invalid scan results')
                  total = 0
                  for filename, findings in data['results'].items():
                      if not isinstance(filename, str) or not filename or '\x00' in filename:
                          raise ValueError('Invalid filename')
                      path = PurePosixPath(filename)
                      if path.is_absolute() or '..' in path.parts or not isinstance(findings, list):
                          raise ValueError('Invalid finding collection')
                      for finding in findings:
                          fields = {'type', 'filename', 'hashed_secret', 'is_verified', 'line_number'}
                          if not isinstance(finding, dict) or set(finding) != fields:
                              raise ValueError('Invalid finding schema')
                          if finding['filename'] != filename or finding['type'] not in secret_types:
                              raise ValueError('Invalid finding metadata')
                          if type(finding['line_number']) is not int or finding['line_number'] < 1:
                              raise ValueError('Invalid finding location')
                          if type(finding['is_verified']) is not bool:
                              raise ValueError('Invalid finding verification')
                          if not isinstance(finding['hashed_secret'], str) or not re.fullmatch(r'[a-f0-9]{40}', finding['hashed_secret']):
                              raise ValueError('Invalid finding hash')
                          total += 1
                  count = total
                  status = 'findings' if count else 'clean'
          except Exception:
              print('Secret scan could not be validated; review fails closed.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              if count is not None:
                  output.write(f'count={count}\nhas_issues={str(count > 0).lower()}\n')
          print('Secret scan status: ' + status)
          raise SystemExit(0 if status == 'clean' else 1)

      # ── TODO / FIXME / HACK check ─────────────────────────────
      - name: Check for leftover TODO/FIXME/HACK
        id: todos
        if: inputs.check-todos
        continue-on-error: true
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          base, head = os.environ.get('BASE_SHA'), os.environ.get('HEAD_SHA')
          refs = [base, head] if base and head else ['HEAD~1']
          result = subprocess.run(
              ['git', 'diff', '--name-only', '-z', *refs, '--',
               '*.py', '*.js', '*.ts', '*.tsx', '*.rs', '*.go'],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True,
          )
          count = 0
          for filename in os.fsdecode(result.stdout).split('\x00'):
              if filename and Path(filename).is_file():
                  text = Path(filename).read_text(encoding='utf-8')
                  count += sum(bool(re.search(r'(TODO|FIXME|HACK|XXX):', line)) for line in text.splitlines())
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'count={count}\nhas_issues={str(count > 0).lower()}\n')

      - name: Check for oversized files
        id: large-files
        if: inputs.max-file-size > 0
        continue-on-error: true
        shell: python
        env:
          MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        run: |
          import os
          from pathlib import Path

          threshold = float(os.environ['MAX_FILE_SIZE']) * 1024
          large = False

          def walk_error(error):
              raise error

          for directory, dirs, files in os.walk('.', onerror=walk_error):
              if directory == '.':
                  dirs[:] = [name for name in dirs if name not in ('.git', 'node_modules', '.venv', '__pycache__')]
              for filename in files:
                  if filename in ('package-lock.json', 'pnpm-lock.yaml') or filename.endswith('.lock'):
                      continue
                  if (Path(directory) / filename).stat().st_size > threshold:
                      large = True
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'has_issues={str(large).lower()}\n')

      - name: Gather diff stats
        id: diff-stats
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --stat "$BASE_SHA" "$HEAD_SHA" > /tmp/diff-stats.txt 2>/dev/null || echo "N/A" > /tmp/diff-stats.txt
            FILES_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null | wc -l || echo 0)
          else
            git diff --stat HEAD~1 > /tmp/diff-stats.txt 2>/dev/null || echo "N/A" > /tmp/diff-stats.txt
            FILES_CHANGED=$(git diff --name-only HEAD~1 2>/dev/null | wc -l || echo 0)
          fi
          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"

      # ── Build summary ─────────────────────────────────────────
      - name: Build review summary
        id: summary
        if: ${{ always() }}
        shell: python
        env:
          REVIEW_STEPS: ${{ toJSON(steps) }}
          SCAN_ENABLED: ${{ inputs.detect-secrets }}
          TODOS_ENABLED: ${{ inputs.check-todos }}
          MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        run: |
          import json
          import os
          import re
          from pathlib import Path

          errors, warnings = [], []
          lines = ['## Automated Code Review', '']
          try:
              steps = json.loads(os.environ['REVIEW_STEPS'])
              if not isinstance(steps, dict):
                  raise ValueError('Invalid step metadata')
              scan_enabled = os.environ['SCAN_ENABLED'] == 'true'
              todos_enabled = os.environ['TODOS_ENABLED'] == 'true'
              if os.environ['SCAN_ENABLED'] not in ('true', 'false') or os.environ['TODOS_ENABLED'] not in ('true', 'false'):
                  raise ValueError('Invalid review inputs')
              required = ['checkout', 'python', 'install-ruff', 'ruff-lint', 'ruff-format']
              if scan_enabled:
                  required += ['install-secrets', 'secrets']
              if todos_enabled:
                  required += ['todos']
              if float(os.environ['MAX_FILE_SIZE']) > 0:
                  required += ['large-files']
              for name in required:
                  if steps.get(name, {}).get('outcome') != 'success':
                      errors.append(name)

              def outputs(name, counted=False):
                  data = steps.get(name, {}).get('outputs', {})
                  if data.get('has_issues') not in ('true', 'false'):
                      raise ValueError('Missing issue output')
                  if counted:
                      if not re.fullmatch(r'0|[1-9][0-9]*', data.get('count', '')):
                          raise ValueError('Missing count output')
                      if (int(data['count']) > 0) != (data['has_issues'] == 'true'):
                          raise ValueError('Inconsistent count output')
                  return data

              lint = outputs('ruff-lint', counted=True)
              fmt = outputs('ruff-format')
              if lint.get('status') != 'complete' or fmt.get('status') != 'complete':
                  raise ValueError('Incomplete lint/format check')
              lines.append(f"### Ruff lint: {lint['count']} issue(s)")
              lines.append('### Ruff format: ' + ('Formatting needed' if fmt['has_issues'] == 'true' else 'Clean'))
              if lint['has_issues'] == 'true' or fmt['has_issues'] == 'true':
                  warnings.append('Lint/format issues')
              if scan_enabled:
                  secrets = outputs('secrets', counted=True)
                  expected_status = 'findings' if secrets['has_issues'] == 'true' else 'clean'
                  if secrets.get('status') != expected_status:
                      raise ValueError('Unvalidated secret scan')
                  lines.append(f"### Secret detection: {secrets['count']} potential secret(s)")
                  if expected_status == 'findings':
                      errors.append('Potential secrets detected')
              else:
                  lines.append('### Secret detection: Disabled by caller')
              for name, enabled, counted in [
                  ('todos', todos_enabled, True),
                  ('large-files', float(os.environ['MAX_FILE_SIZE']) > 0, False),
              ]:
                  if enabled and outputs(name, counted)['has_issues'] == 'true':
                      warnings.append(name)
              lines.extend(['', 'Warnings: ' + ', '.join(warnings)] if warnings else [])
          except Exception:
              errors.append('Required review evidence is missing or invalid')
          verdict = 'fail' if errors else ('warn' if warnings else 'pass')
          if errors:
              lines.extend(['', 'Review incomplete or critical issues found: ' + ', '.join(errors)])
          lines.extend(['', '**Verdict: ' + verdict.upper() + '**', '',
                        '_Automated by [Coding-Dev-Tools/.github](https://github.com/Coding-Dev-Tools/.github) reusable workflow._'])
          body = '\n'.join(lines) + '\n'
          report = Path(os.environ['REVIEW_DIR'])
          report.mkdir(parents=True, exist_ok=True)
          (report / 'review-summary.md').write_text(body, encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'overall={verdict}\n')
          print(body)

      # ── Post PR comment ───────────────────────────────────────
      - name: Post review comment
        if: always() && steps.summary.outcome == 'success' && inputs.post-comment && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.REVIEW_DIR}/review-summary.md`, 'utf8');
            const pr_number = context.payload.pull_request.number;

            // Check for existing bot comment to update instead of duplicating
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr_number,
              per_page: 100
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Automated Code Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr_number,
                body: body
              });
            }

      # ── Fail workflow on critical issues ──────────────────────
      - name: Check verdict
        if: ${{ always() }}
        shell: python
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          VERDICT: ${{ steps.summary.outputs.overall }}
        run: |
          import os

          verdict = os.environ.get('VERDICT', '')
          if os.environ.get('SUMMARY_OUTCOME') != 'success' or verdict not in ('pass', 'warn'):
              print('Review failed or required evidence is unavailable.')
              raise SystemExit(1)
          print('Overall verdict: ' + verdict)
