# CI for Coding-Dev-Tools/.github — validates reusable workflows
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate review workflow contexts
        run: |
          TOOL_DIR="$RUNNER_TEMP/actionlint"
          mkdir -p "$TOOL_DIR"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$TOOL_DIR/actionlint.tar.gz"
          SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          printf '%s  %s\n' "$SHA256" "$TOOL_DIR/actionlint.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$TOOL_DIR/actionlint.tar.gz" --directory "$TOOL_DIR"
          "$TOOL_DIR/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/auto-code-review.yml templates/workflows/auto-code-review.yml .github/workflows/ci.yml
          echo "ACTIONLINT_BIN=$TOOL_DIR/actionlint" >> "$GITHUB_ENV"
      - name: Run workflow validation
        run: bash tests/validate-workflows.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow regression dependencies
        run: python -m pip install PyYAML detect-secrets==1.5.0 ruff
      - name: Execute inline review workflow regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
