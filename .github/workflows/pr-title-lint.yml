# DevForge — Reusable Conventional Commit PR Title Linter
#
# Enforces conventional commit format on PR titles across the org.
# Call from any Coding-Dev-Tools repo:
#
#   name: PR Title Lint
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     lint-pr-title:
#       uses: Coding-Dev-Tools/.github/.github/workflows/pr-title-lint.yml@main

name: PR Title Lint (Conventional Commit)

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR Title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          echo "Checking PR title: $TITLE"
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:\ .+'; then
            echo "✅ PR title follows conventional commit format."
          else
            echo "❌ PR title does not follow conventional commit format."
            echo ""
            echo "Expected: type(optional-scope): description"
            echo "Example:  fix(cli): handle empty input gracefully"
            echo ""
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
